<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATS CV Generator</title>
<style>
:root{box-sizing:border-box;--bg:#f4f5f7;--p:#fff;--t:#1d2330;--b:#d5d9e0;--a:#7b52a6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--p:#1f242d;--t:#e8ebf0;--b:#363d4a;--a:#b48ae0}}
:root[data-theme="dark"]{--bg:#15181e;--p:#1f242d;--t:#e8ebf0;--b:#363d4a;--a:#b48ae0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:850px){.app{grid-template-columns:1fr}}
.panel{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:14px}
h2{font-size:15px;margin:14px 0 8px;color:var(--a)}h2:first-child{margin-top:0}
label{display:block;font-size:12px;margin:6px 0 2px;opacity:.8}
input,textarea,select{width:100%;padding:7px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);font:inherit}
textarea{min-height:60px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px dashed var(--b);border-radius:8px;padding:8px;margin:8px 0}
button{padding:8px 12px;border:1px solid var(--a);background:var(--a);color:#fff;border-radius:6px;cursor:pointer;font:inherit}
button.s{background:transparent;color:var(--a);padding:4px 8px;font-size:12px}
.pv{overflow-x:auto}
#cv{background:#fff;color:#000;width:210mm;min-height:297mm;padding:15mm;margin:auto;box-shadow:0 2px 12px #0003}
#cv h1{margin:0;text-transform:uppercase}
#cv h3{margin:10px 0 4px;padding-top:7px;border-top:1px solid;text-transform:uppercase}
#cv p,#cv ul{margin:2px 0}#cv ul{padding-left:20px}#cv li{margin:1px 0}
.hd{padding-bottom:6px}.hd img{width:90px;height:110px;object-fit:cover;border-radius:4px;margin-bottom:6px}
.sp{display:flex;justify-content:space-between;gap:8px}
@media print{#cv{padding:0!important;width:auto!important;min-height:0!important}body{background:#fff}.app>.panel:first-child{display:none}.app{display:block;padding:0}.panel{border:0;padding:0}#cv{box-shadow:none;margin:0}.pv{overflow:visible}}
#cv .item{break-inside:avoid}#cv h3{break-after:avoid}#st{margin:8px 0;padding:8px;border-radius:6px;background:var(--bg);font-size:12px}</style><style id="pg"></style></head><body>
<div class="app">
<div class="panel" id="f">
<h2>👤 Personal Details</h2>
<label>Full Name</label><input id="name" value="Rasindu Sharitha">
<label>Address</label><input id="loc" value="NO:7/5, 1st Lane Jinna Road Wellakka, Weligama">
<div class="row"><div><label>Phone</label><input id="phone" value="070 4609217"></div><div><label>Email</label><input id="email" value="dtvlogsgnanarathner@gmail.com"></div></div>
<label>Website / LinkedIn</label><input id="link" value="https://rsembedded.github.io/">
<label>Job Title (optional)</label><input id="title" value="">
<label>Photo (optional)</label><input type="file" id="photo" accept="image/*">
<label><input type="checkbox" id="usePhoto" style="width:auto"> Photo CV ekata add karanna (ATS walata photo nathi eka better)</label>
<h2>📝 Summary</h2><textarea id="sum" style="min-height:110px">Electronics and Telecommunication Technology professional with a completed BSc in Electronics and Automation Technology (UG) and HND in Telecommunication Technology (UG).
Skilled in electronics, automation, embedded systems, telecommunications, networking, PCB design, circuit design, and troubleshooting. Experienced in technical system development, testing, maintenance, problem-solving, and practical engineering solutions.</textarea>
<h2>💼 Work Experience</h2><div id="exp"></div><button class="s" onclick="add('exp')">+ Add Experience</button>
<h2>🎓 Education</h2><div id="edu"></div><button class="s" onclick="add('edu')">+ Add Education</button>
<h2>ℹ️ Additional Information</h2>
<label>Line ekakata "Label: details" widiyata (label eka bold wenawa)</label>
<textarea id="extra" style="min-height:170px">Technical Skills: Electronics, Embedded Systems, Microcontroller Programming, Automation, Telecommunication, Networking, PCB Design, Circuit Design, SMD Soldering, Testing and Troubleshooting
Languages: Sinhala, English
Certifications: BSc in Electronics and Automation Technology, HND in Telecommunication Technology
Awards/Activities: Robotics and Automation, Electronic System Development, Communication Systems, Power Electronics, Network Systems and Technical Research</textarea>
<h2>🎨 Formatting</h2>
<div class="row"><div><label>Font</label><select id="font"><option>Arial</option><option>Calibri, Arial</option><option>Times New Roman</option><option>Georgia</option><option>Verdana</option></select></div>
<div><label>Body size (pt)</label><input type="number" id="fs" value="11" min="8" max="16" step=".5"></div></div>
<div class="row"><div><label>Name size (pt)</label><input type="number" id="ns" value="28" min="14" max="40"></div><div><label>Line spacing</label><input type="number" id="ls" value="1.4" min="1" max="2" step=".05"></div></div>
<div class="row"><div><label>Heading colour</label><input type="color" id="hc" value="#7b52a6"></div><div><label>Text colour</label><input type="color" id="tc" value="#000000"></div></div>
<div class="row"><div><label>Header align</label><select id="al"><option>center</option><option>left</option></select></div><div><label>Margin (mm)</label><input type="number" id="mg" value="15" min="8" max="25"></div></div>
<label><input type="checkbox" id="auto" checked style="width:auto"> Auto-fit: page 1k ekata gannawa (font/spacing/margin auto kuda wenawa)</label><div id="st"></div>
<p><button onclick="window.print()">⬇ Download PDF / Print</button></p>
<small>Print dialog eke "Save as PDF" select karanna, "Headers and footers" off karanna.</small>
</div>
<div class="panel pv"><div id="cv"></div></div>
</div>
<script>
const S={exp:[
{a:"Sri Lanka Inventors Commission (SLIC)",b:"",c:"March 03 2026 to Sep 03 2026",d:"Supported electronics, innovation, technical project development, digital content, and system-related activities.\nAssisted with electronic and embedded system projects, technical research, and practical engineering solutions."},
{a:"Arthur C. Clarke Institute for Modern Technologies (ACCIMT)",b:"",c:"Aug 25 2024 to Feb 25 2025",d:"Gained practical experience in telecommunication, electronics, satellite technology, circuit design, testing, calibration, and troubleshooting.\nPerformed equipment calibration, battery testing, surge simulation, and electronic circuit development."},
{a:"GS Micro",b:"",c:"March 2025 to Present",d:"Worked with microcontrollers, embedded systems, electronic circuits, and hardware development. Conducted comprehensive project analyses, identifying and rectifying discrepancies in engineering designs."}],
edu:[
{a:"BSc in Electronics and Automation Technology (UG)",b:"University of Colombo",c:"Sep 2023 -",d:"Specialization in Advanced Manufacturing.\nThesis on \"Innovations in Sustainable Engineering Practices\"."},
{a:"Higher National Diploma (HND) in Telecommunication Technology",b:"University College of Ratmalana – University of Vocational Technology (UoVT)",c:"June 2023 - Sep 2026",d:"Relevant coursework in Structural Design and Project Management."}]};
let img="";
const $=i=>document.getElementById(i),v=i=>$(i).value;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines=s=>s.split("\n").map(x=>x.trim()).filter(Boolean);
function fit(f,ls,m){const cv=$("cv"),H=297*3.7795,ap=()=>{cv.style.fontSize=f+"pt";cv.style.lineHeight=ls;cv.style.padding=m+"mm"};ap();
if($("auto").checked)while(cv.scrollHeight>H+1){if(ls>1.2)ls=+(ls-.05).toFixed(2);else if(f>9.5)f-=.25;else if(m>10)m-=1;else if(ls>1.1)ls=+(ls-.05).toFixed(2);else if(f>8)f-=.25;else break;ap()}
$("pg").textContent="@page{size:A4;margin:"+m+"mm}";const n=Math.ceil((cv.scrollHeight-2)/H);
$("st").innerHTML=n<=1?`✅ 1 page ekata fit. (Font ${f}pt, spacing ${ls}, margin ${m}mm)`:`⚠️ Pages ${n}ak wenawa. Content tikak kuda karanna, nattam margin/font adu karanna. Auto-fit on karanna.`}
function form(){for(const k of["exp","edu"]){const L=k=="exp"?["Company / Job Title","Role (optional)","Dates","Achievements (line by line)"]:["Degree","Institute","Years","Notes (line by line)"];
$(k).innerHTML=S[k].map((e,i)=>`<div class="card"><label>${L[0]}</label><input data-k="${k}" data-i="${i}" data-f="a" value="${esc(e.a)}"><div class="row"><div><label>${L[1]}</label><input data-k="${k}" data-i="${i}" data-f="b" value="${esc(e.b)}"></div><div><label>${L[2]}</label><input data-k="${k}" data-i="${i}" data-f="c" value="${esc(e.c)}"></div></div><label>${L[3]}</label><textarea data-k="${k}" data-i="${i}" data-f="d">${esc(e.d)}</textarea><button class="s" onclick="del('${k}',${i})">Remove</button></div>`).join("")}}
function add(k){S[k].push({a:"",b:"",c:"",d:""});form();render()}
function del(k,i){S[k].splice(i,1);form();render()}
function render(){const hc=v("hc"),fs=+v("fs"),sec=(t,h)=>h?`<h3 style="color:${hc};border-color:${hc};font-size:1.18em">${t}</h3>${h}`:"";
const ul=a=>a.length?"<ul>"+a.map(x=>`<li>${x}</li>`).join("")+"</ul>":"";
const item=e=>`<div class="item" style="margin-bottom:8px"><div class="sp"><b>${esc(e.a)}</b><b style="white-space:nowrap">${esc(e.c)}</b></div>${e.b?`<div>${esc(e.b)}</div>`:""}${ul(lines(e.d).map(esc))}</div>`;
const l1=[v("loc"),v("phone"),v("email")].filter(Boolean).map(esc).join(" • ");
const cv=$("cv");cv.style.cssText=`font-family:${v("font")},sans-serif;font-size:${fs}pt;line-height:${v("ls")};color:${v("tc")};padding:${v("mg")}mm`;
const extra=lines(v("extra")).map(x=>{const i=x.indexOf(":");return i>0?`<b>${esc(x.slice(0,i+1))}</b>${esc(x.slice(i+1))}`:esc(x)});
cv.innerHTML=`<div class="hd" style="text-align:${v("al")}">${$("usePhoto").checked&&img?`<img src="${img}"><br>`:""}<h1 style="font-size:${v("ns")}pt;color:${hc}">${esc(v("name"))}</h1>${v("title")?`<div style="font-size:1.18em"><b>${esc(v("title"))}</b></div>`:""}<div>${l1}</div><div>${esc(v("link"))}</div></div>`
+sec("Summary",lines(v("sum")).map(x=>`<p style="text-align:justify">${esc(x)}</p>`).join(""))
+sec("Work Experience",S.exp.map(item).join(""))
+sec("Education",S.edu.map(item).join(""))
+sec("Additional Information",ul(extra));fit(fs,+v("ls"),+v("mg"))}
$("f").addEventListener("input",e=>{const t=e.target;if(t.dataset.k)S[t.dataset.k][t.dataset.i][t.dataset.f]=t.value;render()});
$("f").addEventListener("change",render);
$("photo").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{img=r.result;$("usePhoto").checked=true;render()};r.readAsDataURL(f)});
form();render();
</script></body></html>
